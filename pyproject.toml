[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharmacy-dwh-etl"
version = "0.1.0"
description = "ETL pipeline for Hospital Pharmacy Data Warehouse — RSUD Ir. Soekarno Sukoharjo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "polars>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "ipython>=8.0.0",
]

[project.scripts]
etl = "etl.run_pipeline:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["etl"]
